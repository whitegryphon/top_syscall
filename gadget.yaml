name: "top_syscall"
description: Periodically report chdir syscall counts by process
homepageURL: https://github.com/whitegryphon/top_syscall
documentationURL: https://github.com/whitegryphon/top_syscall#readme
sourceURL: https://github.com/whitegryphon/top_syscall
datasources:
  calls:
    fields:
      process_id:
        annotations:
          columns.hidden: "true"
      calls:
        annotations:
          description: Chdir attempts in this fetch interval
          columns.width: "12"
          columns.alignment: right
